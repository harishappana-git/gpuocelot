name: Build and Test

on:
  push:
    branches: [master, ci/cuda12-validation]
    tags: ['*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get -y --no-install-recommends install cmake ninja-build libfl-dev
      - name: Install macOS deps
        if: runner.os == 'macOS'
        run: brew install flex bison boost
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        if: runner.os == 'Linux'
        with:
          repository: boostorg/boost
          path: boost
          ref: 1bed2b0712b2119f20d66c5053def9173c8462a5
          persist-credentials: false
      - name: Build Boost (Linux)
        if: runner.os == 'Linux'
        run: |
          cd ${{ github.workspace }}/boost
          git submodule update --depth 1 --init tools/boostdep libs/filesystem libs/thread libs/random libs/asio
          python tools/boostdep/depinst/depinst.py -X test -g "--depth 1" filesystem
          python tools/boostdep/depinst/depinst.py -X test -g "--depth 1" thread
          python tools/boostdep/depinst/depinst.py -X test -g "--depth 1" random
          python tools/boostdep/depinst/depinst.py -X test -g "--depth 1" asio
          ./bootstrap.sh --prefix=${{ github.workspace }}/boost-fpic
          ./b2 install link=static runtime-link=shared threading=multi variant=release cxxflags=-fPIC
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S ocelot -B ocelot/build -G Ninja -DBUILD_TESTS=ON -DBUILD_TESTS_CUDA=OFF -DBOOST_ROOT=${{ github.workspace }}/boost-fpic
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -S ocelot -B ocelot/build -G Ninja -DBUILD_TESTS=ON -DBUILD_TESTS_CUDA=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - name: Build
        run: cmake --build ocelot/build
      - name: Test
        run: ctest --test-dir ocelot/build --output-on-failure
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: libgpuocelot-${{ runner.os }}
          path: ocelot/build/libgpuocelot.${{ runner.os == 'Linux' && 'so' || 'dylib' }}
          if-no-files-found: error
          retention-days: 1

  cuda12-compile:
    name: CUDA 12.8 sm_50 compile
    if: >-
      github.repository == 'harishappana-git/gpuocelot' &&
      github.event_name == 'push' &&
      github.ref_name == 'ci/cuda12-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y --no-install-recommends install \
            cmake ninja-build libfl-dev libboost-filesystem-dev libboost-thread-dev

      - name: Install checksum-verified CUDA 12 compiler
        shell: bash
        run: |
          cuda_root="$RUNNER_TEMP/cuda-12.8"
          mkdir -p "$cuda_root"

          install_component() {
            component="$1"
            version="$2"
            expected_sha256="$3"
            archive="$RUNNER_TEMP/${component}-${version}.tar.xz"
            curl --fail --location --retry 5 --retry-all-errors \
              --output "$archive" \
              "https://developer.download.nvidia.com/compute/cuda/redist/${component}/linux-x86_64/${component}-linux-x86_64-${version}-archive.tar.xz"
            echo "$expected_sha256  $archive" | sha256sum --check -
            tar -xJf "$archive" -C "$cuda_root" --strip-components=1
          }

          install_component cuda_nvcc 12.8.93 \
            9961b3484b6b71314063709a4f9529654f96782ad39e72bf1e00f070db8210d3
          install_component cuda_cccl 12.8.90 \
            0740e9e01e4f15e17c5ab8d68bba4f8ec0eb6b84edccba4ac45112d2d2174e4b
          install_component cuda_cudart 12.8.90 \
            8d566b5fe745c46842dc16945cf36686227536decd2302c372be86da37faca68

          ln -s lib "$cuda_root/lib64"
          echo "$cuda_root/bin" >> "$GITHUB_PATH"
          echo "CUDA_ROOT=$cuda_root" >> "$GITHUB_ENV"
          "$cuda_root/bin/nvcc" --version

      - name: Compile a CUDA test for virtual sm_50
        shell: bash
        run: |
          cmake -S ocelot -B ocelot/build-cuda12 -G Ninja \
            -DBUILD_TESTS=ON \
            -DBUILD_TESTS_CUDA=ON \
            -DBUILD_TOOLS=OFF \
            -DCMAKE_CUDA_COMPILER="$CUDA_ROOT/bin/nvcc" \
            -DCUDAToolkit_ROOT="$CUDA_ROOT" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          ninja -C ocelot/build-cuda12 -v \
            CMakeFiles/gpuocelot_cuda_TestCudaSequence.dir/src/cuda/test/TestCudaSequence.cu.o
          test -f ocelot/build-cuda12/CMakeFiles/gpuocelot_cuda_TestCudaSequence.dir/src/cuda/test/TestCudaSequence.cu.o
          grep -F -- '--generate-code=arch=compute_50,code=[compute_50]' \
            ocelot/build-cuda12/compile_commands.json

  tinygrad-cuda12:
    name: tinygrad CUDA 12 (${{ matrix.backend }})
    needs: test
    if: >-
      github.repository == 'harishappana-git/gpuocelot' &&
      github.event_name == 'push' &&
      github.ref_name == 'ci/cuda12-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        backend: [ptx, nv]
    env:
      CACHE_VERSION: '19'
      CAPTURE_PROCESS_REPLAY: '0'
      CHECK_OOB: '1'
      FORWARD_ONLY: '1'
      PYTHONPATH: ${{ github.workspace }}
      TINYGRAD_SHA: d029e1ac57e2046314cb192511677ac985e22a2f
    steps:
      - name: Download this run's Linux GPUOcelot artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: libgpuocelot-Linux
          path: ${{ runner.temp }}/gpuocelot

      - name: Checkout the exact tinygrad validation commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: harishappana-git/tinygrad
          ref: ${{ env.TINYGRAD_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify pinned tinygrad source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TINYGRAD_SHA"

      - name: Set up tinygrad test dependencies
        uses: ./.github/actions/setup-tinygrad
        with:
          key: cuda12-${{ matrix.backend }}-validation
          deps: testing_unit
          cuda: 'false'
          ocelot: 'false'

      - name: Install checksum-verified CUDA 12 NVRTC
        shell: bash
        run: |
          nvrtc_archive="$RUNNER_TEMP/cuda_nvrtc-12.8.93.tar.xz"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$nvrtc_archive" \
            https://developer.download.nvidia.com/compute/cuda/redist/cuda_nvrtc/linux-x86_64/cuda_nvrtc-linux-x86_64-12.8.93-archive.tar.xz
          echo "992f5e4d95cb499f41e442245efa877dbd60c711451afe680a26700d61eb3843  $nvrtc_archive" \
            | sha256sum --check -
          sudo mkdir -p /usr/local/cuda/targets/x86_64-linux
          sudo tar -xJf "$nvrtc_archive" \
            -C /usr/local/cuda/targets/x86_64-linux \
            --strip-components=1
          echo /usr/local/cuda/targets/x86_64-linux/lib \
            | sudo tee /etc/ld.so.conf.d/cuda-nvrtc.conf
          echo "CUDA_PATH=/usr/local/cuda/targets/x86_64-linux" >> "$GITHUB_ENV"
          sudo ldconfig

      - name: Install this run's GPUOcelot library
        shell: bash
        run: |
          ocelot_artifact="$RUNNER_TEMP/gpuocelot/libgpuocelot.so"
          test -f "$ocelot_artifact"
          file "$ocelot_artifact"
          nm -D --defined-only "$ocelot_artifact" | grep -E ' ptx_run$'
          sha256sum "$ocelot_artifact"
          sudo install -m 0755 "$ocelot_artifact" /usr/local/lib/libgpuocelot.so
          cmp "$ocelot_artifact" /usr/local/lib/libgpuocelot.so
          sudo ldconfig
          ldd_output="$(ldd /usr/local/lib/libgpuocelot.so)"
          printf '%s\n' "$ldd_output"
          ! grep -q 'not found' <<<"$ldd_output"

      - name: Verify CUDA 12 and generated PTX
        shell: bash
        run: |
          python3 - <<'PY'
          import ctypes

          nvrtc = ctypes.CDLL("libnvrtc.so")
          major, minor = ctypes.c_int(), ctypes.c_int()
          assert nvrtc.nvrtcVersion(ctypes.byref(major), ctypes.byref(minor)) == 0
          assert (major.value, minor.value) == (12, 8), (major.value, minor.value)

          from tinygrad.runtime.support.compiler_cuda import NVRTCCompiler
          source = 'extern "C" __global__ void increment(unsigned *x) { x[threadIdx.x]++; }'
          ptx = NVRTCCompiler("sm_50").compile(source).decode()
          assert ".version 8.7" in ptx, ptx[:500]
          assert ".target sm_50" in ptx, ptx[:500]
          print("NVRTC", major.value, minor.value)
          print("\n".join(ptx.splitlines()[:12]))
          PY

      - name: Select tinygrad mock backend
        shell: bash
        run: |
          if [[ "${{ matrix.backend }}" == "ptx" ]]; then
            echo "DEV=MOCK+CUDA:PTX" >> "$GITHUB_ENV"
          else
            echo "DEV=MOCK+NV" >> "$GITHUB_ENV"
            echo "SKIP_SLOW_TEST=1" >> "$GITHUB_ENV"
          fi

      - name: Check Device.DEFAULT and print source
        shell: bash
        run: |
          python3 -c "from tinygrad import Device; assert Device.DEFAULT in ['CUDA','NV'], Device.DEFAULT; assert Device[Device.DEFAULT].arch == 'sm_50', Device[Device.DEFAULT].arch"
          DEBUG=5 FORWARD_ONLY=1 python3 test/test_tiny.py TestTiny.test_plus

      - name: Run exact CUDA mock-backend suite
        shell: bash
        run: |
          python -m pytest -n=auto test/backend \
            --ignore test/backend/test_multitensor.py \
            --durations=20

      - name: Run PMA add
        shell: bash
        run: VIZ=-1 PMA=1 DEBUG=5 python3 test/backend/test_ops.py TestOps.test_add

      - name: Preserve tinygrad process-replay step
        uses: ./.github/actions/process-replay

  release:
    needs: test
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME"
